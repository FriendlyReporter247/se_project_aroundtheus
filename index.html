<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport"/><meta content="ie=edge" http-equiv="X-UA-Compatible"/><title>Around the U.S</title><link rel="icon" type="image/x-icon" href="favicon.ico"/><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body class="page"><div class="page__content"><header class="header page__section"><img src="4e8e0a1d604782a0dff8.svg" alt="Around the US Logo" class="header__logo"/></header><main class="content"><div><section class="profile page__section"><div class="profile__avatar"><img src="74c3c0fb802dcfa83abb.jpg" alt="Avatar" class="profile__image"/> <button class="profile__image-edit"></button></div><div class="profile__info"><h1 class="profile__name">Jacques Cousteau</h1><button type="button" class="profile__edit-button"></button><p class="profile__description">Explorer</p></div><button class="profile__add-card-button" type="button"></button></section><section class="cards page__section"><ul id="cards-list" class="cards__list"></ul></section></div></main><footer class="footer page__section"><p class="footer__text">&copy; Patrick Velazquez 2024</p></footer></div><div id="edit-profile-modal" class="modal"><div class="modal__container"><button class="modal__close"></button><p class="modal__heading">Edit Profile</p><form class="modal__form"><div class="modal__labels"><label class="modal__label" for="modal-input-type-name"><input class="modal__input" id="modal-input-type-name" name="title" placeholder="name" maxlength="40" minlength="2" required/> <span class="modal__error" id="modal-input-type-name-error"></span></label> <label class="modal__label" for="modal-input-type-description"><input class="modal__input" id="modal-input-type-description" name="description" placeholder="description" maxlength="200" minlength="2" required/> <span class="modal__error" id="modal-input-type-description-error
